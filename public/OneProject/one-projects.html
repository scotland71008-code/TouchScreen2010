<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DEEP Project — ADNOC Capital Portfolio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
:root{--surface-0:#ffffff;--surface-1:#f8fafc;--surface-2:#f1f5f9;--text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;--border:#e2e8f0;--border-strong:#cbd5e1}
.app{display:flex;height:680px;width:100%;max-width:1100px;border:.5px solid var(--border);border-radius:14px;overflow:hidden;font-size:13px;background:var(--surface-0);box-shadow:0 4px 24px rgba(0,0,0,.08)}
.sb{width:172px;flex-shrink:0;background:var(--surface-1);border-right:.5px solid var(--border);display:flex;flex-direction:column}
.sb-logo{padding:12px 14px 11px;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:9px}
.sb-logo-n{font-size:12.5px;font-weight:600;color:var(--text-primary);line-height:1.2}
.sb-logo-s{font-size:9.5px;color:var(--text-muted)}
.ns{font-size:9.5px;color:var(--text-muted);padding:10px 14px 3px;letter-spacing:.06em;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:7px;padding:7px 14px;font-size:12px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;border-right:2px solid transparent}
.ni:hover{background:var(--surface-0);color:var(--text-primary)}
.ni.on{color:#2563eb;background:#eff6ff;border-right-color:#2563eb;font-weight:500}
.ni i{font-size:14px;flex-shrink:0}
.nbadge{margin-left:auto;font-size:9px;background:#dc2626;color:#fff;border-radius:8px;padding:1px 5px;font-weight:600}
.sb-ft{margin-top:auto;padding:10px 14px;border-top:.5px solid var(--border);display:flex;flex-direction:column;gap:5px}
.sb-user{display:flex;align-items:center;gap:7px;padding:7px 9px;border:.5px solid var(--border);border-radius:7px;cursor:pointer;background:var(--surface-0)}
.sb-user:hover{background:var(--surface-2)}
.th-btn{display:flex;align-items:center;gap:6px;width:100%;padding:5px 9px;font-size:11px;color:var(--text-secondary);background:transparent;border:.5px solid var(--border);border-radius:6px;cursor:pointer}
.th-btn:hover{background:var(--surface-0);color:var(--text-primary)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:.5px solid var(--border);background:var(--surface-2);flex-shrink:0;gap:8px}
.tb-title{font-size:13px;font-weight:600;color:var(--text-primary)}
.tb-sub{font-size:10px;color:var(--text-muted)}
.fbtn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:.5px solid var(--border);border-radius:5px;font-size:11px;color:var(--text-secondary);background:var(--surface-1);cursor:pointer;white-space:nowrap;flex-shrink:0}
.fbtn:hover,.fbtn.active{border-color:#2563eb;color:#2563eb;background:#eff6ff}
.sync-p{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border:.5px solid #16a34a;border-radius:4px;color:#16a34a;background:#f0fdf4;flex-shrink:0}
.dot-p{width:5px;height:5px;border-radius:50%;background:#16a34a;animation:pp 1.5s ease-in-out infinite}
@keyframes pp{0%,100%{opacity:1}50%{opacity:.2}}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.cnt{flex:1;overflow-y:auto}
.cnt.lm{display:flex;align-items:center;justify-content:center}
.pane{padding:12px 16px;min-height:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:9px}
.mc{background:var(--surface-1);border-radius:8px;padding:10px 12px}
.mc-lb{font-size:10.5px;color:var(--text-muted);margin-bottom:3px}
.mc-v{font-size:21px;font-weight:600;color:var(--text-primary)}
.mc-d{font-size:10px;color:#16a34a;margin-top:2px}
.sc{background:var(--surface-2);border:.5px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:9px}
.sc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sc-t{font-size:12px;font-weight:600;color:var(--text-primary)}
.bw{background:#fffbeb;color:#d97706;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;display:inline-flex;align-items:center}
.bs{background:#f0fdf4;color:#16a34a;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;display:inline-flex;align-items:center}
.bd{background:#fef2f2;color:#dc2626;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;display:inline-flex;align-items:center}
.ba{background:#eff6ff;color:#2563eb;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;display:inline-flex;align-items:center}
.bm{background:var(--surface-1);color:var(--text-secondary);font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;display:inline-flex;align-items:center;border:.5px solid var(--border)}
.row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:.5px solid var(--border);font-size:11px}
.row:last-child{border-bottom:none}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dg{background:#16a34a}.dy{background:#d97706}.dr{background:#dc2626}.db{background:#2563eb}
.rn{flex:1;color:var(--text-primary)}
.rs{font-size:10px;color:var(--text-muted)}
.gb{font-size:10px;padding:3px 8px;cursor:pointer;background:transparent;border:.5px solid var(--border);border-radius:5px;color:var(--text-secondary)}
.gb:hover{background:var(--surface-1);color:var(--text-primary)}
.pr{margin-bottom:7px}
.pl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-secondary);margin-bottom:3px}
.pt{height:5px;background:var(--surface-1);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px}
.ac{border:.5px solid var(--border);border-radius:7px;margin-bottom:6px;overflow:hidden}
.ac-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;background:var(--surface-2);font-size:12px;font-weight:500;color:var(--text-primary)}
.ac-hd:hover{background:var(--surface-1)}
.ac-hl{display:flex;align-items:center;gap:7px}
.ac-cnt{font-size:9.5px;padding:1px 6px;background:var(--surface-1);border:.5px solid var(--border);border-radius:4px;color:var(--text-secondary);font-weight:400}
.ac-bd{display:none;padding:7px 12px;background:var(--surface-0)}
.ac-bd.open{display:block}
.it{display:flex;gap:8px;padding:5px 0;border-bottom:.5px solid var(--border);font-size:11px}
.it:last-child{border-bottom:none}
.it-m{flex:1}
.it-t{color:var(--text-primary);margin-bottom:1px}
.it-s{color:var(--text-muted);font-size:10px}
.hr2{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:.5px solid var(--border);font-size:11px}
.hr2:last-child{border-bottom:none}
.hi{width:24px;height:24px;background:#eff6ff;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hi i{font-size:12px;color:#2563eb}
.hm{flex:1}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.mb{background:var(--surface-2);border:.5px solid var(--border);border-radius:14px;padding:18px;width:100%;max-width:440px}
.mb-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px}
.mb-t{font-size:14px;font-weight:600;color:var(--text-primary)}
.mb-x{cursor:pointer;color:var(--text-muted);background:none;border:none;font-size:22px;line-height:1;padding:0}
.mb-s{font-size:10px;color:var(--text-muted);margin-bottom:11px;padding-bottom:9px;border-bottom:.5px solid var(--border)}
.cs{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.ch{display:flex;align-items:flex-start;gap:7px;padding:8px;border:.5px solid var(--border);border-radius:7px;background:var(--surface-1)}
.ch.act{border-color:#2563eb;background:#eff6ff}
.ch.dn{opacity:.65}
.ca{width:26px;height:26px;border-radius:50%;background:var(--surface-0);border:.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ca i{font-size:13px;color:var(--text-secondary)}
.ci{flex:1}
.cr{font-size:11px;font-weight:600;color:var(--text-primary)}
.cn2{font-size:10px;color:var(--text-muted)}
.cst{font-size:10px;margin-top:1px}
.ma{display:flex;gap:6px}
.ma button{flex:1;padding:7px;font-size:11px;border-radius:6px;cursor:pointer;border:.5px solid var(--border);background:transparent;color:var(--text-secondary)}
.ma button:hover{background:var(--surface-1);color:var(--text-primary)}
.ma .pb{background:#2563eb;color:#fff;border-color:#2563eb}
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;width:100%;background:var(--surface-2);padding:24px}
.auth-card{background:var(--surface-0);border:.5px solid var(--border);border-radius:16px;padding:32px 36px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.08)}
.auth-logo{display:flex;align-items:center;gap:11px;margin-bottom:28px}
.auth-title{font-size:20px;font-weight:700;color:var(--text-primary)}
.auth-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
.auth-field{margin-bottom:14px}
.auth-label{font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;display:block}
.auth-input{width:100%;padding:9px 12px;font-size:13px;border:.5px solid var(--border);border-radius:8px;background:var(--surface-1);color:var(--text-primary);outline:none;font-family:inherit;transition:border-color .15s}
.auth-input:focus{border-color:#2563eb;background:var(--surface-0)}
.auth-btn{width:100%;padding:10px;font-size:13px;font-weight:600;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-top:6px;transition:background .15s;font-family:inherit}
.auth-btn:hover{background:#1d4ed8}
.auth-err{display:none;font-size:11px;color:#dc2626;background:#fef2f2;border:.5px solid #fecaca;border-radius:6px;padding:7px 10px;margin-top:10px;text-align:center}
.auth-err.show{display:block}
.auth-footer{margin-top:18px;font-size:10px;color:var(--text-muted);text-align:center}
.login-wrap{display:flex;flex-direction:column;align-items:center;padding:24px;width:100%;max-width:560px}
.login-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.lc{padding:11px;border:.5px solid var(--border);border-radius:10px;cursor:pointer;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;transition:all .15s}
.lc:hover{border-color:#2563eb;background:var(--surface-1);transform:translateY(-1px);box-shadow:0 2px 8px rgba(37,99,235,.12)}
.lc-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.lc-name{font-size:11px;font-weight:600;color:var(--text-primary);line-height:1.2}
.lc-role{font-size:9.5px;color:var(--text-muted)}
.lc-ent{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:500;margin-top:1px}
.role-banner{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:7px;margin-bottom:10px;font-size:11px;font-weight:500}
.stat-row{display:flex;align-items:center;gap:12px}
.stat-pill{display:flex;align-items:center;gap:4px;font-size:11px}
.stat-pill .dot{width:8px;height:8px}
.map-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:9px}
.map-kpi-card{background:var(--surface-2);border:.5px solid var(--border);border-radius:9px;padding:11px 13px}
.mkc-title{font-size:11px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
.mkc-num{font-size:24px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
#map-container{border:.5px solid var(--border);border-radius:9px;overflow:hidden;height:380px}
.leaflet-container{font-size:12px!important}
.map-popup-title{font-size:13px;font-weight:700;margin-bottom:3px;color:#111}
.map-popup-sub{font-size:11px;color:#666;margin-bottom:7px}
.map-popup-projs{font-size:11px}
.map-popup-proj{display:flex;align-items:center;gap:6px;padding:3px 0}
.map-popup-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.adm-hd{display:grid;grid-template-columns:1fr 95px 125px 55px;gap:6px;font-size:10px;color:var(--text-muted);font-weight:600;padding:0 0 7px;border-bottom:.5px solid var(--border);margin-bottom:5px}
.adm-row{display:grid;grid-template-columns:1fr 95px 125px 55px;gap:6px;align-items:center;padding:7px 0;border-bottom:.5px solid var(--border);font-size:11px}
.adm-row:last-child{border-bottom:none}
.adm-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.adm-ep{background:var(--surface-1);border:.5px solid var(--border);border-radius:8px;padding:11px;margin:4px 0 7px}
select{padding:4px 7px;font-size:11px;border:.5px solid var(--border);border-radius:5px;background:var(--surface-2);color:var(--text-primary);cursor:pointer;width:100%}
.access-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.mini-tree-plant{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:.5px solid var(--border)}
.mini-tree-plant:last-child{border-bottom:none}
/* ── Reports hub CSS variable aliases ── */
:root{--bgCard:var(--surface-0);--bg3:var(--surface-2);--b1:var(--border);--b2:var(--border-strong);--t1:var(--text-primary);--t2:var(--text-secondary);--t3:var(--text-muted);--green:#059669;--greenLt:#ECFDF5;--amber:#D97706;--amberLt:#FFFBEB;--red:#DC2626;--redLt:#FEF2F2;--blue:#2563EB;--blueLt:#EFF4FF;--purple:#7C3AED;--purpleLt:#F5F3FF;--track:#E5EBF3}
/* KPI strip */
.rh-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:11px}
.rh-kpi{background:var(--bgCard);border:1px solid var(--b1);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:4px}
.rh-kpi-val{font-size:26px;font-weight:800;line-height:1;color:var(--t1)}
.rh-kpi-lbl{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.rh-kpi-sub{font-size:11px;color:var(--t2);margin-top:2px}
.rh-kpi.blue .rh-kpi-val{color:var(--blue)}.rh-kpi.green .rh-kpi-val{color:var(--green)}.rh-kpi.amber .rh-kpi-val{color:var(--amber)}.rh-kpi.red .rh-kpi-val{color:#DC2626}.rh-kpi.purple .rh-kpi-val{color:#7C3AED}
/* Widget grid */
.rh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.rh-card{background:var(--bgCard);border:1px solid var(--b1);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:220px}
.rh-card.wide{grid-column:span 2}
.rh-card.tall{min-height:280px}
.rwc-hd{padding:9px 13px 8px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:7px;flex-shrink:0}
.rwc-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t2);flex:1}
.rwc-body{flex:1;display:flex;padding:12px;gap:12px;align-items:center;min-height:0}
.rwc-canvas-wrap{flex:0 0 auto}
.rwc-leg{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.rwc-leg-item{display:flex;align-items:center;gap:7px;cursor:pointer;padding:3px 5px;border-radius:5px;transition:background .1s}
.rwc-leg-item:hover{background:var(--bg3)}
.rwc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rwc-leg-name{font-size:11px;color:var(--t2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwc-leg-val{font-size:11px;font-weight:700;color:var(--t1);flex-shrink:0;background:var(--bg3);padding:1px 5px;border-radius:4px;min-width:26px;text-align:right}
.rwc-bar-wrap{flex:1;min-height:0;width:100%;position:relative}
/* table */
.rh-tbl-wrap{flex:1;overflow:auto;padding:0 13px 12px;max-height:220px}
.rh-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.rh-tbl th{padding:6px 9px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);font-weight:700;border-bottom:1px solid var(--b1);position:sticky;top:0;background:var(--bgCard)}
.rh-tbl td{padding:6px 9px;border-bottom:1px solid var(--b1);color:var(--t1);vertical-align:top}
.rh-tbl tr:last-child td{border-bottom:none}
.rh-tbl tr:hover td{background:var(--bg3)}
.rh-pill{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap}
.rh-pill.green{background:var(--greenLt);color:var(--green)}.rh-pill.amber{background:var(--amberLt);color:var(--amber)}.rh-pill.blue{background:var(--blueLt);color:var(--blue)}.rh-pill.red{background:#FEE2E2;color:#DC2626}.rh-pill.purple{background:#F3E8FF;color:#7C3AED}
.rh-link{color:var(--blue);font-weight:700;cursor:pointer;text-decoration:none;border-bottom:1px dashed var(--blue)}
.rh-link:hover{background:var(--blueLt);border-radius:3px}
/* drill drawer */
.rh-drill{position:relative;height:0;overflow:hidden;transition:height .25s ease;border-top:2px solid transparent}
.rh-drill.open{height:200px;border-top-color:var(--blue);margin-top:8px;background:var(--bgCard);border-radius:8px}
.rh-drill-hd{padding:9px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--b1)}
.rh-drill-title{font-size:13px;font-weight:700;color:var(--t1);flex:1}
.rh-drill-close{width:24px;height:24px;border:none;background:var(--bg3);border-radius:5px;cursor:pointer;color:var(--t2);font-size:14px;display:flex;align-items:center;justify-content:center}
.rh-drill-body{padding:8px 14px;overflow-y:auto;height:calc(100% - 42px)}
/* rh tab bar */
.rh-tabs{display:flex;gap:3px;margin-bottom:11px;flex-wrap:wrap}
.rh-tab{padding:5px 12px;font-size:11.5px;font-weight:600;border:1px solid var(--b1);border-radius:6px;cursor:pointer;color:var(--t2);background:var(--surface-1);transition:all .12s}
.rh-tab:hover{background:var(--bg3);color:var(--t1)}
.rh-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.rh-proj-sel{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding:9px 12px;background:var(--bg3);border-radius:8px;border:1px solid var(--b1)}
.rh-proj-sel label{font-size:11px;color:var(--t2);font-weight:600;flex-shrink:0}
@media(max-width:900px){.rh-kpi-row{grid-template-columns:repeat(2,1fr)}.rh-grid{grid-template-columns:1fr}.rh-card.wide{grid-column:span 1}}
.dt-tabs{display:flex;gap:4px;margin-bottom:10px}
.dt{padding:5px 11px;font-size:11px;border:.5px solid var(--border);border-radius:5px;cursor:pointer;color:var(--text-secondary);background:var(--surface-1)}
.dt:hover{background:var(--surface-0);color:var(--text-primary)}
.dt.on{background:#2563eb;color:#fff;border-color:#2563eb}
.tree-wrap{background:var(--surface-2);border:.5px solid var(--border);border-radius:10px;overflow:hidden}
.tree-search{display:flex;gap:6px;padding:10px 12px;border-bottom:.5px solid var(--border)}
.tree-search input{flex:1;padding:5px 9px;font-size:12px;border:.5px solid var(--border);border-radius:5px;background:var(--surface-1);color:var(--text-primary);outline:none}
.tree-search input:focus{border-color:#2563eb}
.tree-search button{padding:5px 11px;font-size:11px;background:#2563eb;color:#fff;border:none;border-radius:5px;cursor:pointer}
.tree-all-row{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:.5px solid var(--border);font-size:12px}
.tree-plant-row{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer;border-bottom:.5px solid var(--border)}
.tree-plant-row:hover{background:var(--surface-1)}
.tree-proj-row{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 42px;border-bottom:.5px solid var(--border);background:var(--surface-0)}

function plantStatus(pl){var w='dg';pl.projs.forEach(function(pid){var d=ALL_PROJ[pid].dot;if(d==='dr')w='dr';else if(d==='dy'&&w!=='dr')w='dy';});return w;}
function getAPBase(){if(!cu)return[];return PLANTS.filter(function(p){if(cu.entity==='all')return true;if(p.entity!==cu.entity)return false;if(cu.plants&&cu.plants.length>0)return cu.plants.indexOf(p.id)>=0;return true;});}
function getAP(){return getAPBase().filter(function(p){return p.projs.some(function(pid){return!excludedProjs[pid];});});}
function getAPR(){if(!cu)return[];if(cu.proj)return excludedProjs[cu.proj]?[]:[cu.proj];return Object.keys(ALL_PROJ).filter(function(id){if(excludedProjs[id])return false;var p=ALL_PROJ[id];if(cu.entity==='all')return true;if(p.entity!==cu.entity)return false;if(cu.plants&&cu.plants.length>0)return cu.plants.indexOf(p.plant)>=0;return true;});}
function canDSP(){return cu&&(cu.role==='svp'||cu.role==='vp'||cu.role==='admin');}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
function pb(pct,col){return'<div class="pt"><div class="pf" style="width:'+pct+'%;background:'+col+'"></div></div>';}
function roleBanner(){if(!cu)return'';var rc=ROLE_CFG[cu.role],ap=getAP(),apr=getAPR();return'<div class="role-banner" style="background:'+rc.bg+';color:'+rc.color+'"><i class="ti ti-lock"></i>'+rc.label+' · '+ap.length+' plant'+(ap.length!==1?'s':'')+' · '+apr.length+' project'+(apr.length!==1?'s':'')+' visible</div>';}

function login(uid){
  cu=USERS.find(function(u){return u.id===uid;});if(!cu)return;
  cv=ROLE_CFG[cu.role].nav[0];filterOpen=false;
  var rc=ROLE_CFG[cu.role];
  document.getElementById('sb').style.display='flex';
  document.getElementById('topbar').style.display='flex';
  document.getElementById('cnt').classList.remove('lm');
  var av=document.getElementById('sb-av');av.textContent=cu.ini;av.style.background=rc.bg;av.style.color=rc.color;
  document.getElementById('sb-uname').textContent=cu.name;
  document.getElementById('sb-urole').textContent=rc.label+(cu.entity!=='all'?' · '+cap(cu.entity):'');

function rhRenderConstruction(){

  var secHdr=function(t,s){return'<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin:20px 0 10px"><span style="font-size:13.5px;font-weight:700;color:var(--text-primary)">'+t+'</span><span style="font-size:10px;color:var(--text-muted)">'+s+'</span></div>';};
  var projData=projIds.map(function(id){
    var d=getRHData(id);var p=ALL_PROJ[id]||{};
    var ms=d.milestones||[];
    var ifc=ms.find(function(m){return m.code==='IFC';})||{pct:50};
    var s=parseInt(id.replace(/\D/g,''))||1;
    function rn(a,b){s=(s*1103515245+12345)&0x7fffffff;return a+Math.floor(s%(b-a+1));}
    var actual=Math.max(0,Math.min(90,Math.round(ifc.pct*0.68)+rn(-4,4)));
    var variance=rn(4,9);
    var planned=Math.min(100,actual+variance);
    var cwps=rn(6,12);
    var complete=Math.round(cwps*(actual/100)*rn(50,70)/100);
    var inProg=Math.min(cwps-complete,Math.round((cwps-complete)*0.7)+rn(1,2));
    var plannedWps=Math.max(0,cwps-complete-inProg);
    var withDates=cwps-rn(0,2);
    return{id:id,name:p.name||d._label||id,actual:actual,planned:planned,variance:variance,cwps:cwps,complete:complete,inProg:inProg,plannedWps:plannedWps,withDates:withDates};
  });

  else if(cv==='docs')c.innerHTML='<div class="pane">'+vDocs()+'</div>';

function mapGoTo(projId){

function vPredictive(){
  /* ── deterministic mock-data generator ── */
  var _s=7331;
  function ri(a,b){_s=(_s*1103515245+12345)&0x7fffffff;return a+(_s%(b-a+1));}
  function rf(a,b){_s=(_s*1103515245+12345)&0x7fffffff;return+(a+(_s%10000)/10000*(b-a)).toFixed(2);}
  var today=new Date('2026-09-29');
  function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function fmt(d){return d.toISOString().slice(0,10);}

  /* ── IWP dataset (18 records) ── */
  var CRAFTS=['Piping','Electrical','Instrument','Structural','Mechanical','Civil'];
  var AREAS=['Module A','Module B','Utility Area','Process Area','Control Room','Offsites'];
  var iwps=[];
  for(var i=0;i<18;i++){
    var du=ri(2,28),bom=ri(38,100),con=ri(0,5),dur=ri(4,18);
    var sc=0;
    if(du<7)sc+=0.30;else if(du<14)sc+=0.16;else if(du<21)sc+=0.07;
    sc+=(1-bom/100)*0.42;sc+=Math.min(con*0.11,0.28);sc=+Math.min(0.99,sc).toFixed(2);
    iwps.push({id:'IWP-UL-'+CRAFTS[i%6].slice(0,3).toUpperCase()+'-'+(1001+i),
      desc:CRAFTS[i%6]+' install — '+AREAS[i%6],craft:CRAFTS[i%6],area:AREAS[i%6],
      start:fmt(addD(today,du)),du:du,dur:dur,con:con,bom:bom,sc:sc,
      risk:sc>=0.50?'High':sc>=0.25?'Medium':'Low'});
  }
  iwps.sort(function(a,b){return b.sc-a.sc;});

  /* ── Materials / supply-chain dataset (24 records) ── */
  var ITEMS=['Pipe Spools 6" CS','Control Valve CV-401','Cable Tray Supports','Instrument Tubing','Structural Beams','Heat Exchanger Nozzles','MCC Panel Bus-bars','Pressure Gauges','Gate Valves 4"','Gaskets ASME 150#','Cable XLPE 3×150mm','Flange Sets SS316','Level Transmitters','Bolt Sets A193-B7','Expansion Joints','Flow Elements','Pipe Supports Std','Isolation Valves','Cable Glands IP68','Thermowell Assy','Pump Seals Mech.','Rupture Discs','Earthing Clamps','Flex Conduit SS'];
  var mats=[];
  for(var j=0;j<24;j++){
    var iwpRef=iwps[j%iwps.length];
    var devDays=ri(-3,18);
    var reqDate=addD(today,iwpRef.du-1);
    var eta=addD(reqDate,devDays);
    var imp=devDays>14?'Critical':devDays>7?'High':devDays>2?'Medium':devDays>0?'Low':'On Track';
    mats.push({item:ITEMS[j],po:'PO-UL-'+(2001+j),iwp:iwpRef.id,craft:iwpRef.craft,
      reqDate:fmt(reqDate),eta:fmt(eta),dev:devDays,imp:imp,
      qty:ri(5,200),pct:ri(0,100)});
  }
  mats.sort(function(a,b){return b.dev-a.dev;});

  /* ── Completions / handover dataset ── */
  var SUBS=['Process System','Utility Systems','MV Power Distribution','DCS / ICSS','Fire & Gas','Gas Compression','Water Injection','Produced Water Treatment'];
  var WEEKS=12;
  var subsystems=SUBS.map(function(name,i){
    var totalItr=ri(40,180),passRate=ri(55,96);
    var pA=ri(0,12),pB=ri(4,30);
    /* weekly punch generation / closure over 12 weeks */
    var gen=[],clo=[];var cumGen=0,cumClo=0;
    for(var w=0;w<WEEKS;w++){
      var g=ri(3,12),c=Math.min(cumGen-cumClo+g,ri(2,10));
      gen.push(g);clo.push(c);cumGen+=g;cumClo+=c;
    }

function vModal(){
  var id=mi,pr=ALL_PROJ[id],pl=pr?PLANTS.find(function(p){return p.id===pr.plant;}):null;
  if(!pr)return'<div class="mo"><div class="mb"><button class="mb-x" onclick="closeModal()">×</button></div></div>';
  var canEndorse=cu&&(cu.role==='svp'||cu.role==='vp'||cu.role==='admin');
  var chain=[{role:'Originator',name:'Ahmed Al-Mansoori',org:'Project Controls',ico:'ti-user',st:'Submitted',col:'#16a34a',dn:true},{role:'Reviewer',name:'Sarah Chen',org:'EP&C Engineering',ico:'ti-user-check',st:'Reviewed',col:'#16a34a',dn:true},{role:'Endorser',name:cu&&cu.role==='vp'?cu.name:'Khalid Al-Mazrouei',org:'VP '+(pl?pl.name:''),ico:'ti-user-star',st:'Pending endorsement',col:'#2563eb',act:true},{role:'Gate keeper',name:'Abdulla Al-Suwaidi',org:'SVP Capital Projects',ico:'ti-crown',st:'Awaiting',col:'var(--text-muted)'}];
  return'<div class="mo" onclick="if(event.target===this)closeModal()"><div class="mb"><div class="mb-hd"><div class="mb-t">'+pr.gate+'</div><button class="mb-x" onclick="closeModal()">×</button></div><div class="mb-s">'+(pl?pl.name+' · ':'')+pr.name+'</div><div class="cs">'+chain.map(function(s){return'<div class="ch'+(s.act?' act':'')+(s.dn&&!s.act?' dn':'')+'"><div class="ca"><i class="ti '+s.ico+'"></i></div><div class="ci"><div class="cr">'+s.role+'</div><div class="cn2">'+s.name+' · '+s.org+'</div><div class="cst" style="color:'+s.col+'">'+s.st+'</div></div>'+(s.dn&&!s.act?'<i class="ti ti-circle-check" style="color:#16a34a;font-size:14px"></i>':'')+(s.act?'<span class="ba" style="font-size:9px">Action needed</span>':'')+'</div>';}).join('')+'</div><div class="ma"><button onclick="alert(\'Clarify request sent\')">Clarify ↗</button><button onclick="alert(\'Resubmit initiated\')">Resubmit ↗</button>'+(canEndorse?'<button class="pb" onclick="alert(\'Endorsed! Routing to SVP via OneHub.\')">Endorse ↗</button>':'<button disabled style="opacity:.4;cursor:not-allowed">Endorse</button>')+'</div>'+(!canEndorse?'<div style="font-size:10px;color:var(--text-muted);margin-top:6px;text-align:center"><i class="ti ti-lock"></i> Endorsement requires VP or SVP role</div>':'')+'</div></div>';
}

function toggleProj(pid,e){e&&e.stopPropagation();if(excludedProjs[pid])delete excludedProjs[pid];else excludedProjs[pid]=true;renderFilter();}
function togglePlant(plantId,e){e&&e.stopPropagation();var pl=PLANTS.find(function(x){return x.id===plantId;});if(!pl)return;var allExcl=pl.projs.every(function(pid){return excludedProjs[pid];});pl.projs.forEach(function(pid){if(allExcl)delete excludedProjs[pid];else excludedProjs[pid]=true;});renderFilter();}
function toggleAllPlants(){var base=getAPBase();var allProjs=[];base.forEach(function(p){p.projs.forEach(function(pid){allProjs.push(pid);});});var allExcl=allProjs.every(function(pid){return excludedProjs[pid];});allProjs.forEach(function(pid){if(allExcl)delete excludedProjs[pid];else excludedProjs[pid]=true;});renderFilter();}
function resetFilter(){excludedProjs={};filterSearch='';renderFilter();}

function vPlantFilter(){
  var base=getAPBase(),query=filterSearch.toLowerCase();
  var allProjs=[];base.forEach(function(p){p.projs.forEach(function(pid){allProjs.push(pid);});});
  var selCount=allProjs.filter(function(pid){return!excludedProjs[pid];}).length;
  var allChecked=selCount===allProjs.length,noneChecked=selCount===0;
  var filtered=base.filter(function(p){return!query||p.name.toLowerCase().includes(query)||p.opco.toLowerCase().includes(query)||p.loc.toLowerCase().includes(query)||p.projs.some(function(pid){return ALL_PROJ[pid].name.toLowerCase().includes(query);});});
  var html='<div class="tree-wrap"><div class="tree-search"><input type="text" placeholder="Search plants, OPCOs & projects..." value="'+filterSearch+'" oninput="filterSearch=this.value;renderFilter()"><button onclick="renderFilter()"><i class="ti ti-search"></i></button></div>';
  /* all-plants toggle row */
  html+='<div class="tree-all-row" onclick="toggleAllPlants()" style="cursor:pointer">'
    +'<input type="checkbox" id="chk-all" '+(allChecked?'checked':'')+((!allChecked&&!noneChecked)?' style="opacity:.6"':'')+' onclick="event.stopPropagation();toggleAllPlants()">'
    +'<span style="font-weight:600;color:var(--text-primary);flex:1">All plants &amp; projects</span>'
    +'<span style="font-size:10.5px;color:var(--text-muted)">'+selCount+' / '+allProjs.length+' selected</span>'
    +'<button style="font-size:11px;color:#2563eb;cursor:pointer;background:none;border:none;font-family:inherit;margin-left:8px" onclick="event.stopPropagation();resetFilter()">Reset</button>'
    +'</div>';
  filtered.forEach(function(pl){
    var st=plantStatus(pl),col=st==='dr'?'#dc2626':st==='dy'?'#d97706':'#16a34a';
    var isExp=filterExp[pl.id];
    var pjs=pl.projs.filter(function(pid){if(!query)return true;return ALL_PROJ[pid].name.toLowerCase().includes(query)||pl.name.toLowerCase().includes(query)||pl.opco.toLowerCase().includes(query);});
    var plantSelCount=pjs.filter(function(pid){return!excludedProjs[pid];}).length;
    var plantAllChk=plantSelCount===pjs.length,plantNoneChk=plantSelCount===0;
    html+='<div class="tree-plant-row" onclick="filterExp[\''+pl.id+'\']=!filterExp[\''+pl.id+'\'];renderFilter()">'
      +'<input type="checkbox" '+(plantAllChk?'checked':'')+(!plantAllChk&&!plantNoneChk?' style="opacity:.6"':'')+' onclick="togglePlant(\''+pl.id+'\',event)">'
      +'<span style="width:9px;height:9px;border-radius:50%;background:'+col+';flex-shrink:0"></span>'
      +'<div style="flex:1"><div style="font-size:12.5px;font-weight:600;color:'+(plantNoneChk?'var(--text-muted)':'var(--text-primary)')+'">'+pl.name+'</div>'
        +'<div style="font-size:10.5px;color:var(--text-muted)">'+pl.opco+' · '+plantSelCount+'/'+pjs.length+' project'+(pjs.length!==1?'s':'')+' selected</div></div>'
      +'<i class="ti ti-chevron-'+(isExp||query?'up':'down')+'" style="font-size:13px;color:var(--text-muted)"></i></div>';
    if(isExp||query){
      pjs.forEach(function(pid){
        var p=ALL_PROJ[pid],excl=excludedProjs[pid];
        html+='<div class="tree-proj-row" onclick="toggleProj(\''+pid+'\',event)" style="cursor:pointer">'
          +'<input type="checkbox" '+(excl?'':'checked')+' onclick="toggleProj(\''+pid+'\',event)">'
          +'<span style="font-size:12px;color:'+(excl?'var(--text-muted)':'var(--text-primary)')+';flex:1;text-decoration:'+(excl?'line-through':'none')+'">'+p.name+'</span>'
          +'<span class="'+p.gs+'" style="font-size:9.5px">'+p.gate+'</span>'
        +'</div>';
      });
    }
  });
  html+='</div><div style="display:flex;gap:8px;margin-top:11px">'
    +'<button class="gb" onclick="filterOpen=false;sv(prevView)" style="flex:1;padding:8px;font-size:12px">← Back</button>'
    +'<button style="flex:1;padding:8px;font-size:12px;background:#2563eb;color:#fff;border:none;border-radius:5px;cursor:pointer;font-family:inherit" onclick="filterOpen=false;sv(prevView)">Apply ('+selCount+' projects) ↗</button>'
    +'</div>';
  return html;
}
function renderFilter(){filterSearch=document.querySelector('.tree-search input')?document.querySelector('.tree-search input').value:'';document.getElementById('cnt').innerHTML='<div class="pane">'+vPlantFilter()+'</div>';}

</script>
