<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #87ceeb 0%, #e0f6ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 150, 200, 0.3);
            max-width: 400px;
            width: 100%;
            border: 5px solid #1e90ff;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .hello-kitty-title {
            font-size: 36px;
            font-weight: bold;
            color: #1e90ff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 150, 200, 0.3);
        }

        .bow {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .display {
            background: linear-gradient(135deg, #e0f6ff 0%, #b3e5fc 100%);
            border: 3px solid #1e90ff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            font-size: 48px;
            font-weight: bold;
            color: #0047ab;
            min-height: 70px;
            word-wrap: break-word;
            word-break: break-all;
            box-shadow: inset 0 2px 5px rgba(0, 150, 200, 0.2);
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Arial', cursive;
            box-shadow: 0 4px 8px rgba(255, 182, 193, 0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        .number-btn {
            background: linear-gradient(135deg, #f0f8ff 0%, #e0f6ff 100%);
            color: #0047ab;
            border: 2px solid #64b5f6;
            font-size: 28px;
        }

        .number-btn:hover {
            background: linear-gradient(135deg, #e0f6ff 0%, #b3e5fc 100%);
            box-shadow: 0 6px 12px rgba(0, 150, 200, 0.3);
        }

        .operator-btn {
            background: linear-gradient(135deg, #1e90ff 0%, #0047ab 100%);
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        .operator-btn:hover {
            background: linear-gradient(135deg, #0047ab 0%, #002d5c 100%);
            box-shadow: 0 6px 12px rgba(0, 71, 171, 0.4);
        }

        .equals-btn {
            background: linear-gradient(135deg, #ffa500 0%, #ff8c00 100%);
            color: white;
            grid-column: span 2;
            font-size: 26px;
            font-weight: bold;
        }

        .equals-btn:hover {
            background: linear-gradient(135deg, #ff8c00 0%, #ff7f00 100%);
            box-shadow: 0 6px 12px rgba(255, 140, 0, 0.4);
        }

        .clear-btn {
            background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
            color: white;
            grid-column: span 2;
            border: 2px solid #1e90ff;
            font-size: 20px;
        }

        .clear-btn:hover {
            background: linear-gradient(135deg, #42a5f5 0%, #2196f3 100%);
            box-shadow: 0 6px 12px rgba(30, 144, 255, 0.4);
        }

        .message {
            text-align: center;
            font-size: 20px;
            color: #0047ab;
            font-weight: bold;
            margin-top: 15px;
            min-height: 25px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .hello-kitty-title {
                font-size: 28px;
            }

            .display {
                font-size: 36px;
                padding: 15px;
            }

            button {
                padding: 16px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="bow">🐧</div>
            <div class="hello-kitty-title">Penguin<br>Calculator</div>
        </div>

        <div class="display" id="display">0</div>

        <div class="buttons-grid">
            <button class="clear-btn" onclick="clearDisplay()">CLEAR</button>
            <button class="operator-btn" onclick="appendOperator('/')" style="grid-column: 3;">÷</button>
            <button class="operator-btn" onclick="appendOperator('*')">×</button>

            <button class="number-btn" onclick="appendNumber('7')">7</button>
            <button class="number-btn" onclick="appendNumber('8')">8</button>
            <button class="number-btn" onclick="appendNumber('9')">9</button>
            <button class="operator-btn" onclick="appendOperator('-')">−</button>

            <button class="number-btn" onclick="appendNumber('4')">4</button>
            <button class="number-btn" onclick="appendNumber('5')">5</button>
            <button class="number-btn" onclick="appendNumber('6')">6</button>
            <button class="operator-btn" onclick="appendOperator('+')">+</button>

            <button class="number-btn" onclick="appendNumber('1')">1</button>
            <button class="number-btn" onclick="appendNumber('2')">2</button>
            <button class="number-btn" onclick="appendNumber('3')">3</button>
            <button class="operator-btn" onclick="deleteLastDigit()">⌫</button>

            <button class="number-btn" onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
            <button class="number-btn" onclick="appendNumber('.')">.</button>
            <button class="equals-btn" onclick="calculate()">=</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        let display = document.getElementById('display');
        let message = document.getElementById('message');
        let currentInput = '0';
        let operator = null;
        let previousValue = null;
        let shouldResetDisplay = false;

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function appendNumber(num) {
            if (shouldResetDisplay) {
                currentInput = num;
                shouldResetDisplay = false;
            } else {
                if (currentInput === '0' && num !== '.') {
                    currentInput = num;
                } else if (num === '.' && currentInput.includes('.')) {
                    return;
                } else {
                    currentInput += num;
                }
            }
            message.textContent = '';
            updateDisplay();
        }

        function appendOperator(op) {
            if (operator && !shouldResetDisplay) {
                calculate();
            }
            previousValue = parseFloat(currentInput);
            operator = op;
            shouldResetDisplay = true;
            message.textContent = '';
        }

        function calculate() {
            if (operator === null || previousValue === null) {
                return;
            }

            const current = parseFloat(currentInput);
            let result;

            switch (operator) {
                case '+':
                    result = previousValue + current;
                    break;
                case '-':
                    result = previousValue - current;
                    break;
                case '*':
                    result = previousValue * current;
                    break;
                case '/':
                    if (current === 0) {
                        message.textContent = '🐧 Cannot divide by zero! 🐧';
                        return;
                    }
                    result = previousValue / current;
                    break;
                default:
                    return;
            }

            currentInput = result.toString();
            operator = null;
            previousValue = null;
            shouldResetDisplay = true;
            message.textContent = '❄️ Awesome! ❄️';
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            operator = null;
            previousValue = null;
            shouldResetDisplay = false;
            message.textContent = '🐧 Ready to calculate! 🐧';
            updateDisplay();
        }

        function deleteLastDigit() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            message.textContent = '';
            updateDisplay();
        }

        // Initialize
        updateDisplay();
        message.textContent = '🐧 Ready to calculate! 🐧';
    </script>
</body>
</html>
